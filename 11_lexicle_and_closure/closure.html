    <title>Closure Scope</title>
</head>
<body>
    
</body>
<script>
    function Outer(){
        let username = "Arjun";
        function inner(){
            console.log("Inner", username);
        }
        function innerTwo(){
            console.log("InnerTwo", username);
        }
        inner();
        innerTwo()
    }
    Outer()
</script>
